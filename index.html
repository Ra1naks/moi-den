<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Мой день</title>
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Мой день">
<meta name="theme-color" content="#EEF1F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E131D" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: one narrow column like a pocket diary — week strip on top, day sections below, floating "+" bottom right */
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --surface-2:#F5F7FB; --line:#DCE1EA;
  --fg:#162033; --muted:#647089; --accent:#2D5BFF; --accent-soft:#E3E9FF;
  --hot:#E0453A; --hot-soft:#FDE6E3; --money:#13875C; --money-soft:#DDF3E9;
  --shadow:0 1px 2px rgba(22,32,51,.06),0 6px 20px rgba(22,32,51,.07);
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E131D; --surface:#171E2B; --surface-2:#1E2636; --line:#2A3446;
  --fg:#E7ECF5; --muted:#8C98B0; --accent:#6E8DFF; --accent-soft:#1F2A4D;
  --hot:#FF6B5E; --hot-soft:#3A1E1D; --money:#3CC48D; --money-soft:#16302A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E131D; --surface:#171E2B; --surface-2:#1E2636; --line:#2A3446;
  --fg:#E7ECF5; --muted:#8C98B0; --accent:#6E8DFF; --accent-soft:#1F2A4D;
  --hot:#FF6B5E; --hot-soft:#3A1E1D; --money:#3CC48D; --money-soft:#16302A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-block:16px 120px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.top h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.top .sub{color:var(--muted);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.today-btn{font-size:13px;font-weight:700;padding:7px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}

.week{display:grid;grid-template-columns:28px repeat(7,1fr) 28px;align-items:center;gap:4px;background:var(--surface);border-radius:18px;padding:8px 6px;box-shadow:var(--shadow)}
.week .nav{height:52px;border-radius:10px;color:var(--muted);font-size:18px}
.day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 7px;border-radius:12px;min-width:0}
.day .wd{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.day .dn{font-size:17px;font-weight:800}
.day .dots{display:flex;gap:3px;height:5px}
.day .dots i{width:5px;height:5px;border-radius:50%;background:var(--muted);opacity:.5}
.day .dots i.hot{background:var(--hot);opacity:1}
.day.is-today .dn{color:var(--accent)}
.day.is-sel{background:var(--accent);}
.day.is-sel .wd,.day.is-sel .dn{color:#fff}
.day.is-sel .dots i{background:#fff;opacity:.8}

.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);min-width:0}
.stat b{display:block;font-size:18px;font-weight:800}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.stat.money b{color:var(--money)}

.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chip{padding:7px 13px;border-radius:999px;font-size:13px;font-weight:700;background:var(--surface);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

section.block{display:flex;flex-direction:column;gap:6px}
.block h2{margin:6px 2px 2px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.block h2 em{font-style:normal;color:var(--fg)}
.list{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-top:1px solid var(--line);position:relative}
.row:first-child{border-top:0}
.row.hot::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--hot)}
.row .main{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:1px;padding:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .meta{font-size:12px;color:var(--muted);font-weight:600}
.row.done .t{text-decoration:line-through;color:var(--muted)}
.time{font-size:13px;font-weight:600;color:var(--accent);min-width:46px;display:flex;flex-direction:column;line-height:1.25}
.time small{font-size:12px;color:var(--muted);font-weight:500}
.amount{font-weight:600;color:var(--money);white-space:nowrap}
.check{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.check[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.check svg{width:14px;height:14px;opacity:0}
.check[aria-checked="true"] svg{opacity:1}
.star{width:32px;height:32px;border-radius:10px;flex:none;display:grid;place-items:center;color:var(--line)}
.star svg{width:18px;height:18px}
.star[aria-pressed="true"]{color:var(--hot)}
.pill{font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;background:var(--hot-soft);color:var(--hot);text-transform:uppercase;letter-spacing:.04em}
.move{font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}

.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:16px;padding:22px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}
.note{font-size:12px;color:var(--muted);text-align:center}

.fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:20px;background:var(--accent);color:#fff;box-shadow:0 8px 24px rgba(45,91,255,.4);display:grid;place-items:center;z-index:5}
.fab svg{width:26px;height:26px}

.overlay{position:fixed;inset:0;background:rgba(10,14,22,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:12px;max-height:92%;overflow-y:auto}
.sheet h3{margin:0;font-size:18px;font-weight:800}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface-2);padding:4px;border-radius:12px}
.seg button{padding:9px 4px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;min-width:0}
.f input,.f select{font:inherit;font-size:16px;text-transform:none;letter-spacing:0;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border-radius:12px;background:var(--surface-2);font-weight:700}
.toggle input{width:22px;height:22px;accent-color:var(--hot);flex:none}
#fCarry,#fAll{accent-color:var(--accent)}
.actions{display:flex;gap:8px}
.btn{flex:1;padding:13px;border-radius:14px;font-weight:800;font-size:15px}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:var(--surface-2)}
.btn.danger{background:var(--hot-soft);color:var(--hot);flex:0 0 auto;padding-inline:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
.backup{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-start;padding-right:72px}
.backup button,.backup label{font-size:13px;font-weight:700;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted);cursor:pointer}
.backup input{display:none}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <div class="sub" id="subTitle"></div>
      <h1 id="dayTitle">Сегодня</h1>
    </div>
    <button class="today-btn" id="todayBtn" type="button">Сегодня</button>
  </header>

  <nav class="week" id="week" aria-label="Неделя"></nav>

  <div class="summary" id="summary"></div>

  <div class="chips" role="group" aria-label="Фильтр">
    <button class="chip" data-f="all" aria-pressed="true" type="button">Всё</button>
    <button class="chip" data-f="hot" aria-pressed="false" type="button">Важное</button>
    <button class="chip" data-f="event" aria-pressed="false" type="button">Расписание</button>
    <button class="chip" data-f="task" aria-pressed="false" type="button">Дела</button>
    <button class="chip" data-f="expense" aria-pressed="false" type="button">Траты</button>
  </div>

  <main id="content"></main>
  <p class="note" id="syncNote"></p>
  <div class="backup">
    <button type="button" id="exportBtn">Сохранить копию</button>
    <label for="importFile">Загрузить копию<input type="file" id="importFile" accept="application/json,.json"></label>
  </div>
</div>

<button class="fab" id="fab" type="button" aria-label="Добавить">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<div class="overlay" id="overlay" hidden>
  <form class="sheet" id="form" autocomplete="off">
    <h3 id="formTitle">Новая запись</h3>
    <div class="seg" id="typeSeg">
      <button type="button" data-t="event" aria-pressed="true">Событие</button>
      <button type="button" data-t="task" aria-pressed="false">Дело</button>
      <button type="button" data-t="expense" aria-pressed="false">Трата</button>
    </div>
    <label class="f">Что
      <input id="fText" type="text" placeholder="Например: встреча с куратором" maxlength="200">
    </label>
    <div class="two" id="rowEvent">
      <label class="f" id="lblFrom">С<input id="fTime" type="time"></label>
      <label class="f" id="lblTo">До<input id="fTimeEnd" type="time"></label>
      <label class="f" style="grid-column:1/-1">День<input id="fDate" type="date"></label>
    </div>
    <div class="two" id="rowExpense" hidden>
      <label class="f">Сумма, ₽<input id="fAmount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0"></label>
      <label class="f">Категория
        <select id="fCat">
          <option>Еда</option><option>Транспорт</option><option>Дом</option>
          <option>Покупки</option><option>Учёба</option><option>Развлечения</option><option>Другое</option>
        </select>
      </label>
    </div>
    <label class="toggle" for="fHot">Важное <input id="fHot" type="checkbox"></label>
    <label class="toggle" for="fCarry" id="rowCarry">Переносить на каждый следующий день, пока не сделаю <input id="fCarry" type="checkbox"></label>
    <div class="two" id="rowRepeat">
      <label class="f">Повтор
        <select id="fRep">
          <option value="">Не повторять</option>
          <option value="d1">Каждый день</option>
          <option value="wd">По будням</option>
          <option value="w1">Каждую неделю</option>
          <option value="w2">Через неделю</option>
        </select>
      </label>
      <label class="f" id="rowUntil" hidden>До какого дня<input id="fUntil" type="date"></label>
    </div>
    <label class="toggle" for="fAll" id="rowAll" hidden>Изменить и все следующие повторы <input id="fAll" type="checkbox"></label>
    <button type="button" class="btn danger" id="delAllBtn" hidden style="flex:none;width:100%">Удалить этот и все следующие повторы</button>
    <div class="actions">
      <button type="button" class="btn danger" id="delBtn" hidden>Удалить</button>
      <button type="button" class="btn ghost" id="cancelBtn">Отмена</button>
      <button type="submit" class="btn primary" id="saveBtn">Добавить</button>
    </div>
  </form>
</div>

<div class="toast" id="toast" hidden></div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const pad = n => String(n).padStart(2, "0");
  const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const dateOf = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d); };
  const addDays = (k, n) => { const d = dateOf(k); d.setDate(d.getDate()+n); return keyOf(d); };
  const todayKey = () => keyOf(new Date());
  const money = n => new Intl.NumberFormat("ru-RU", {maximumFractionDigits: 2}).format(n) + " ₽";
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  const WD = ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
  const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const ICON_STAR = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z"/></svg>';

  const state = { days: {}, sel: todayKey(), filter: "all", mode: "loading", editing: null, formType: "event" };

  // ---------- storage: this device only ----------
  const LS = "moi-den-v1";
  let storageOk = true;
  const loadLocal = () => { try { state.days = JSON.parse(localStorage.getItem(LS) || "{}") || {}; } catch { state.days = {}; storageOk = false; } };
  const saveLocal = () => {
    try { localStorage.setItem(LS, JSON.stringify(state.days)); storageOk = true; }
    catch { storageOk = false; toast("Не получилось сохранить на устройстве"); }
  };
  function setItems(key, items) {
    if (items.length) state.days[key] = items; else delete state.days[key];
    saveLocal(); render();
  }
  function initStore() {
    loadLocal();
    state.mode = "local";
    try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}
    render();
  }

  // ---------- backup ----------
  $("#exportBtn").addEventListener("click", async () => {
    const json = JSON.stringify({ app: "moi-den", version: 1, savedAt: new Date().toISOString(), days: state.days }, null, 1);
    const name = `moi-den-${todayKey()}.json`;
    const file = new File([json], name, { type: "application/json" });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: "Мой день — копия" }); return; }
    } catch (e) { if (e && e.name === "AbortError") return; }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(file); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast("Копия сохранена");
  });
  $("#importFile").addEventListener("change", async e => {
    const f = e.target.files && e.target.files[0]; e.target.value = "";
    if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      const days = data && data.days;
      if (!days || typeof days !== "object") throw 0;
      let n = 0;
      for (const [k, items] of Object.entries(days)) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(k) || !Array.isArray(items)) continue;
        const have = state.days[k] || [], ids = new Set(have.map(x => x.id));
        const add = items.filter(x => x && x.id && !ids.has(x.id));
        if (add.length) { state.days[k] = [...have, ...add]; n += add.length; }
      }
      saveLocal(); render();
      toast(n ? `Добавлено записей: ${n}` : "Новых записей в копии нет");
    } catch { toast("Это не файл копии «Моего дня»"); }
  });

  if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));

  // ---------- render ----------
  function render() {
    const sel = state.sel, today = todayKey();
    const d = dateOf(sel);
    const rel = sel === today ? "Сегодня" : sel === addDays(today, 1) ? "Завтра" : sel === addDays(today, -1) ? "Вчера" : "";
    $("#subTitle").textContent = d.toLocaleDateString("ru-RU", { weekday: "long" }) + (rel ? " · " + rel : "");
    $("#dayTitle").textContent = d.toLocaleDateString("ru-RU", { day: "numeric", month: "long" });
    $("#todayBtn").hidden = sel === today;

    // week
    const dow = (d.getDay() + 6) % 7;
    const monday = addDays(sel, -dow);
    let w = `<button class="nav" type="button" data-nav="-7" aria-label="Прошлая неделя">‹</button>`;
    for (let i = 0; i < 7; i++) {
      const k = addDays(monday, i), items = state.days[k] || [];
      const hot = items.some(x => x.hot && !x.done);
      const dots = items.length ? `<i class="${hot ? "hot" : ""}"></i>` + (items.length > 2 ? "<i></i>" : "") : "";
      w += `<button type="button" class="day${k === today ? " is-today" : ""}${k === sel ? " is-sel" : ""}" data-day="${k}" aria-label="${dateOf(k).toLocaleDateString("ru-RU",{day:"numeric",month:"long"})}">
        <span class="wd">${WD[i]}</span><span class="dn">${dateOf(k).getDate()}</span><span class="dots">${dots}</span></button>`;
    }
    w += `<button class="nav" type="button" data-nav="7" aria-label="Следующая неделя">›</button>`;
    $("#week").innerHTML = w;

    const items = state.days[sel] || [];
    const events = items.filter(x => x.type === "event").sort((a, b) => (a.time || "99").localeCompare(b.time || "99"));
    const carried = [];
    Object.entries(state.days).forEach(([k, it]) => {
      if (k < sel) it.forEach(x => { if (x.type === "task" && x.carry && (!x.done || x.doneOn === sel)) carried.push({ ...x, _k: k }); });
    });
    const tasks = [...items.filter(x => x.type === "task"), ...carried].sort((a, b) => (a.done - b.done) || (b.hot - a.hot));
    const exps = items.filter(x => x.type === "expense");
    const dayTotal = exps.reduce((s, x) => s + (+x.amount || 0), 0);
    const ym = sel.slice(0, 7);
    const monthTotal = Object.entries(state.days).filter(([k]) => k.startsWith(ym))
      .reduce((s, [, it]) => s + it.filter(x => x.type === "expense").reduce((a, x) => a + (+x.amount || 0), 0), 0);
    const doneN = tasks.filter(t => t.done).length;
    const monthName = d.toLocaleDateString("ru-RU", { month: "long" });

    $("#summary").innerHTML = `
      <div class="stat"><b class="mono">${events.length}</b><span>в расписании</span></div>
      <div class="stat"><b class="mono">${doneN}/${tasks.length}</b><span>дел сделано</span></div>
      <div class="stat money"><b class="mono">${money(dayTotal)}</b><span>за ${monthName}: ${money(monthTotal)}</span></div>`;

    document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(c.dataset.f === state.filter)));

    if (state.mode === "loading") { $("#content").innerHTML = `<div class="empty"><b>Загружаю…</b>Подтягиваю твои записи</div>`; return; }

    const f = state.filter, show = t => f === "all" || f === "hot" || f === t;
    const pick = arr => f === "hot" ? arr.filter(x => x.hot) : arr;
    let html = "";

    // unfinished tasks from earlier days, shown on today
    if (sel === today && (f === "all" || f === "task" || f === "hot")) {
      const tail = [];
      Object.entries(state.days).forEach(([k, it]) => { if (k < today) it.forEach(x => { if (x.type === "task" && !x.done && !x.carry && (f !== "hot" || x.hot)) tail.push({ ...x, _k: k }); }); });
      if (tail.length) {
        tail.sort((a, b) => a._k.localeCompare(b._k));
        html += `<section class="block"><h2>Не сделано раньше <em class="mono">${tail.length}</em></h2><div class="list">` +
          tail.map(x => `<div class="row${x.hot ? " hot" : ""}">
            <button type="button" class="check" role="checkbox" aria-checked="false" data-check="${x.id}" data-k="${x._k}" aria-label="Отметить сделанным">${ICON_CHECK}</button>
            <button type="button" class="main" data-edit="${x.id}" data-k="${x._k}"><span class="t">${esc(x.text)}</span><span class="meta">${dateOf(x._k).toLocaleDateString("ru-RU",{day:"numeric",month:"short"})}</span></button>
            <button type="button" class="move" data-move="${x.id}" data-k="${x._k}">На сегодня</button></div>`).join("") + `</div></section>`;
      }
    }

    const evs = pick(events), tks = pick(tasks), exs = pick(exps);
    if (show("event") && evs.length) html += `<section class="block"><h2>Расписание <em class="mono">${evs.length}</em></h2><div class="list">` +
      evs.map(x => row(x, `<span class="time mono">${esc(x.time || "—")}${x.timeEnd ? `<small>до ${esc(x.timeEnd)}</small>` : ""}</span>`, "",
        [durText(x), repMeta(x)].filter(Boolean).join(" · "))).join("") + `</div></section>`;
    if (show("task") && tks.length) html += `<section class="block"><h2>Дела <em class="mono">${tks.filter(t=>t.done).length}/${tks.length}</em></h2><div class="list">` +
      tks.map(x => row(x, `<button type="button" class="check" role="checkbox" aria-checked="${!!x.done}" data-check="${x.id}" data-k="${x._k || sel}" aria-label="Сделано">${ICON_CHECK}</button>`, "",
        x.carry ? (x._k ? `↻ переносится с ${dateOf(x._k).toLocaleDateString("ru-RU",{day:"numeric",month:"short"})}` : "↻ переносится, пока не сделаю") : repMeta(x))).join("") + `</div></section>`;
    if (show("expense") && exs.length) html += `<section class="block"><h2>Траты <em class="mono">${money(exs.reduce((s,x)=>s+(+x.amount||0),0))}</em></h2><div class="list">` +
      exs.map(x => row(x, "", `<span class="amount mono">${money(+x.amount || 0)}</span>`, [x.cat, repMeta(x)].filter(Boolean).join(" · "))).join("") + `</div></section>`;

    if (!html) {
      const msg = {
        all: ["День пока пустой", "Нажми «+», чтобы добавить событие, дело или трату"],
        hot: ["Важного нет", "Отметь запись звёздочкой, и она появится здесь"],
        event: ["Расписание пустое", "Добавь событие со временем через «+»"],
        task: ["Дел нет", "Добавь дело через «+»"],
        expense: ["Трат нет", "Записывай расходы через «+», итог за месяц считается сам"],
      }[f];
      html = `<div class="empty"><b>${msg[0]}</b>${msg[1]}</div>`;
    }
    $("#content").innerHTML = `<div style="display:flex;flex-direction:column;gap:14px">${html}</div>`;
    $("#syncNote").textContent = storageOk ? "Записи хранятся только на этом устройстве. Иногда сохраняй копию." : "Браузер не даёт сохранять данные. Выключи частный режим.";
  }

  const REP = { d1: "каждый день", wd: "по будням", w1: "каждую неделю", w2: "через неделю" };
  const repMeta = x => x.rep && REP[x.repKind] ? "↻ " + REP[x.repKind] : "";
  const mins = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
  function durText(x) {
    if (!x.time || !x.timeEnd) return "";
    const d = mins(x.timeEnd) - mins(x.time);
    if (d <= 0) return "";
    const h = Math.floor(d / 60), m = d % 60;
    return (h ? h + " ч" : "") + (h && m ? " " : "") + (m ? m + " мин" : "");
  }
  function row(x, lead, tail, meta) {
    const k = x._k || state.sel;
    return `<div class="row${x.hot ? " hot" : ""}${x.done ? " done" : ""}">${lead}
      <button type="button" class="main" data-edit="${x.id}" data-k="${k}"><span class="t">${esc(x.text || "Без названия")}</span>${meta ? `<span class="meta">${esc(meta)}</span>` : ""}</button>
      ${tail}<button type="button" class="star" aria-pressed="${!!x.hot}" data-star="${x.id}" data-k="${k}" aria-label="Важное">${ICON_STAR}</button></div>`;
  }
  // dates for a repeat rule, from start to until (inclusive), at most 400
  function repeatDates(start, until, kind) {
    const out = [];
    for (let k = start, i = 0; k <= until && out.length < 400; k = addDays(k, 1), i++) {
      const wd = (dateOf(k).getDay() + 6) % 7;
      if (kind === "d1" || (kind === "wd" && wd < 5) || (kind === "w1" && i % 7 === 0) || (kind === "w2" && i % 14 === 0)) out.push(k);
    }
    return out;
  }

  // ---------- form ----------
  function setType(t) {
    state.formType = t;
    document.querySelectorAll("#typeSeg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.t === t)));
    $("#rowExpense").hidden = t !== "expense";
    $("#lblFrom").hidden = $("#lblTo").hidden = t !== "event";
    syncExtras();
    $("#fText").placeholder = { event: "Например: пара по матану", task: "Например: сдать отчёт", expense: "Например: обед" }[t];
  }
  function syncExtras() {
    const t = state.formType, editing = !!state.editing;
    const carry = t === "task" && $("#fCarry").checked;
    $("#rowCarry").hidden = t !== "task";
    $("#rowRepeat").hidden = editing || carry;
    $("#rowUntil").hidden = !$("#fRep").value;
  }
  $("#fCarry").addEventListener("change", syncExtras);
  $("#fRep").addEventListener("change", syncExtras);
  $("#fDate").addEventListener("change", () => {
    if ($("#fDate").value && $("#fUntil").value < $("#fDate").value) $("#fUntil").value = addDays($("#fDate").value, 7 * 16);
  });

  function openForm(item, key) {
    state.editing = item ? { id: item.id, key } : null;
    $("#fCarry").checked = !!(item && item.carry);
    $("#fRep").value = "";
    $("#fUntil").value = addDays(key || state.sel, 7 * 16);
    $("#fAll").checked = false;
    $("#rowAll").hidden = !(item && item.rep);
    $("#delAllBtn").hidden = !(item && item.rep);
    $("#formTitle").textContent = item ? "Изменить" : "Новая запись";
    $("#saveBtn").textContent = item ? "Сохранить" : "Добавить";
    $("#delBtn").hidden = !item;
    const t = item ? item.type : (state.filter === "task" || state.filter === "expense" ? state.filter : "event");
    setType(t);
    $("#fText").value = item ? item.text || "" : "";
    $("#fTime").value = item ? item.time || "" : "";
    $("#fTimeEnd").value = item ? item.timeEnd || "" : "";
    $("#fDate").value = key || state.sel;
    $("#fAmount").value = item && item.amount != null ? item.amount : "";
    $("#fCat").value = item && item.cat ? item.cat : "Еда";
    $("#fHot").checked = item ? !!item.hot : state.filter === "hot";
    $("#overlay").hidden = false;
    setTimeout(() => $("#fText").focus(), 50);
  }
  const closeForm = () => { $("#overlay").hidden = true; state.editing = null; };

  $("#form").addEventListener("submit", e => {
    e.preventDefault();
    const t = state.formType, text = $("#fText").value.trim();
    const amount = parseFloat(String($("#fAmount").value).replace(",", "."));
    if (t === "expense" && !(amount > 0)) { toast("Укажи сумму"); $("#fAmount").focus(); return; }
    if (t !== "expense" && !text) { toast("Напиши, что запланировано"); $("#fText").focus(); return; }
    const tFrom = $("#fTime").value, tTo = $("#fTimeEnd").value;
    if (t === "event" && tTo && !tFrom) { toast("Укажи, со скольки"); $("#fTime").focus(); return; }
    if (t === "event" && tFrom && tTo && tTo <= tFrom) { toast("Время «до» должно быть позже, чем «с»"); $("#fTimeEnd").focus(); return; }
    const key = $("#fDate").value || state.sel;
    const ed = state.editing;
    let prev = null;
    if (ed) {
      const old = state.days[ed.key] || [];
      prev = old.find(x => x.id === ed.id);
      setItems(ed.key, old.filter(x => x.id !== ed.id));
    }
    const item = { id: ed ? ed.id : uid(), type: t, text, hot: $("#fHot").checked, done: prev && t === "task" ? !!prev.done : false };
    if (prev && prev.doneOn) item.doneOn = prev.doneOn;
    if (t === "event") { item.time = tFrom; if (tTo) item.timeEnd = tTo; }
    if (t === "expense") { item.amount = Math.round(amount * 100) / 100; item.cat = $("#fCat").value; }
    if (t === "task" && $("#fCarry").checked) item.carry = true;
    if (prev && prev.rep) { item.rep = prev.rep; item.repKind = prev.repKind; }

    const kind = !ed && !item.carry ? $("#fRep").value : "";
    if (kind) {
      const until = $("#fUntil").value;
      if (!until || until < key) { toast("Укажи, до какого дня повторять"); $("#fUntil").focus(); return; }
      const rep = uid(), dates = repeatDates(key, until, kind);
      dates.forEach(k => { (state.days[k] = state.days[k] || []).push({ ...item, id: uid(), rep, repKind: kind }); });
      saveLocal(); render(); closeForm();
      toast(`Добавлено повторов: ${dates.length}, последний${dateOf(dates[dates.length - 1]).toLocaleDateString("ru-RU", { day: "numeric", month: "long" })}`);
      return;
    }
    setItems(key, [...(state.days[key] || []), item]);

    if (ed && prev && prev.rep && $("#fAll").checked) {
      const fields = { text: item.text, hot: item.hot, type: item.type };
      if (t === "event") { fields.time = item.time; fields.timeEnd = item.timeEnd || ""; }
      if (t === "expense") { fields.amount = item.amount; fields.cat = item.cat; }
      let n = 0;
      Object.keys(state.days).forEach(k => {
        if (k < ed.key) return;
        state.days[k] = state.days[k].map(x => x.rep === prev.rep && x.id !== item.id ? (n++, { ...x, ...fields }) : x);
      });
      saveLocal(); render();
      toast(`Изменено повторов: ${n + 1}`);
    } else if (key !== state.sel) toast("Добавлено на " + dateOf(key).toLocaleDateString("ru-RU", { day: "numeric", month: "long" }));
    closeForm();
  });
  $("#delAllBtn").addEventListener("click", () => {
    const ed = state.editing; if (!ed) return;
    const it = findItem(ed.key, ed.id); if (!it || !it.rep) return;
    let n = 0;
    Object.keys(state.days).forEach(k => {
      if (k < ed.key) return;
      const left = state.days[k].filter(x => x.rep !== it.rep);
      n += state.days[k].length - left.length;
      if (left.length) state.days[k] = left; else delete state.days[k];
    });
    saveLocal(); render(); closeForm();
    toast(`Удалено повторов: ${n}`);
  });
  $("#delBtn").addEventListener("click", () => {
    const ed = state.editing; if (!ed) return;
    setItems(ed.key, (state.days[ed.key] || []).filter(x => x.id !== ed.id));
    closeForm(); toast("Удалено");
  });
  $("#cancelBtn").addEventListener("click", closeForm);
  $("#overlay").addEventListener("click", e => { if (e.target.id === "overlay") closeForm(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#overlay").hidden) closeForm(); });
  $("#typeSeg").addEventListener("click", e => { const b = e.target.closest("button"); if (b) setType(b.dataset.t); });
  $("#fab").addEventListener("click", () => openForm(null));

  // ---------- interactions ----------
  const findItem = (k, id) => (state.days[k] || []).find(x => x.id === id);
  const patch = (k, id, p) => setItems(k, (state.days[k] || []).map(x => x.id === id ? { ...x, ...p } : x));

  document.addEventListener("click", e => {
    const el = e.target.closest("[data-day],[data-nav],[data-check],[data-star],[data-edit],[data-move],.chip");
    if (!el) return;
    if (el.dataset.day) { state.sel = el.dataset.day; render(); }
    else if (el.dataset.nav) { state.sel = addDays(state.sel, +el.dataset.nav); render(); }
    else if (el.dataset.check) { const k = el.dataset.k, it = findItem(k, el.dataset.check); if (it) patch(k, it.id, { done: !it.done, doneOn: !it.done ? state.sel : null }); }
    else if (el.dataset.star) { const k = el.dataset.k || state.sel, it = findItem(k, el.dataset.star); if (it) patch(k, it.id, { hot: !it.hot }); }
    else if (el.dataset.edit) { const k = el.dataset.k, it = findItem(k, el.dataset.edit); if (it) openForm(it, k); }
    else if (el.dataset.move) {
      const k = el.dataset.k, it = findItem(k, el.dataset.move), t = todayKey();
      if (it) { setItems(k, state.days[k].filter(x => x.id !== it.id)); setItems(t, [...(state.days[t] || []), it]); toast("Перенесено на сегодня"); }
    }
    else if (el.classList.contains("chip")) { state.filter = el.dataset.f; render(); }
  });
  $("#todayBtn").addEventListener("click", () => { state.sel = todayKey(); render(); });

  // swipe left/right on content to change day
  let sx = null, sy = null;
  $("#content").addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  $("#content").addEventListener("touchend", e => {
    if (sx == null) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) { state.sel = addDays(state.sel, dx < 0 ? 1 : -1); render(); }
    sx = null;
  });

  let tt;
  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2200); }

  initStore();
})();
</script>
</body>
</html>
